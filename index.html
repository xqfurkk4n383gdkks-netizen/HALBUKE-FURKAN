<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halbuke & Furkan</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #0a0a0a;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
  }

  /* Ortadaki Atan Kalp */
  .main-heart {
    position: relative;
    width: 200px;
    height: 200px;
    background: #ff2a2a;
    transform: rotate(-45deg);
    animation: heartbeat 1.2s infinite;
    box-shadow: 0 0 50px #ff2a2a;
    z-index: 10;
  }

  .main-heart::before, .main-heart::after {
    content: "";
    position: absolute;
    width: 200px;
    height: 200px;
    background: #ff2a2a;
    border-radius: 50%;
  }

  .main-heart::before {
    top: -100px;
    left: 0;
  }

  .main-heart::after {
    top: 0;
    left: 100px;
  }

  /* Kalbin İçindeki Yazı */
  .heart-text {
    position: absolute;
    transform: rotate(45deg);
    top: 40px;
    left: -20px;
    width: 240px;
    text-align: center;
    z-index: 20;
    font-size: 26px;
    font-weight: bold;
    color: white;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    line-height: 1.5;
  }

  /* Kalp Atış Animasyonu */
  @keyframes heartbeat {
    0% { transform: scale(1) rotate(-45deg); }
    20% { transform: scale(1.15) rotate(-45deg); }
    40% { transform: scale(1) rotate(-45deg); }
    60% { transform: scale(1.15) rotate(-45deg); }
    80% { transform: scale(1) rotate(-45deg); }
    100% { transform: scale(1) rotate(-45deg); }
  }

  /* Arka Planda Uçuşan Halbuke Yazıları */
  .floating-text {
    position: absolute;
    color: #ff4d4d;
    font-weight: bold;
    animation: floatUp linear infinite;
    opacity: 0;
    z-index: 1;
    text-shadow: 0 0 10px #ff0000;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    20% { opacity: 0.8; }
    80% { opacity: 0.8; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
  }

  /* Müzik Butonu */
  #music-btn {
    position: absolute;
    bottom: 30px;
    padding: 12px 25px;
    background: transparent;
    color: #ff2a2a;
    border: 2px solid #ff2a2a;
    border-radius: 30px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    z-index: 100;
    transition: 0.3s;
  }

  #music-btn:hover {
    background: #ff2a2a;
    color: white;
    box-shadow: 0 0 15px #ff2a2a;
  }
</style>
</head>
<body>

<button id="music-btn">🎵 Müziği Başlat</button>

<audio id="bg-music" loop>
  <source src="angel_i_love_you.mp3" type="audio/mpeg">
</audio>

<div class="main-heart">
  <div class="heart-text">HALBUKE<br>&<br>FURKAN</div>
</div>

<script>
  // Arka planda uçuşan "HALBUKE ♥" yazılarını oluşturan sistem
  function createFloatingText() {
    const text = document.createElement('div');
    text.classList.add('floating-text');
    text.innerHTML = "HALBUKE &hearts;";
    
    // Rastgele yatay konum
    text.style.left = Math.random() * 100 + "vw";
    
    // Rastgele uçuş süresi ve boyutu
    text.style.animationDuration = (Math.random() * 4 + 4) + "s";
    text.style.fontSize = (Math.random() * 15 + 12) + "px";
    
    document.body.appendChild(text);

    // Ekranda kaybolduktan sonra silinmesi için
    setTimeout(() => {
      text.remove();
    }, 8000);
  }

  // Her 400 milisaniyede bir yeni yazı oluştur
  setInterval(createFloatingText, 400);

  // Müzik kontrol sistemi
  document.getElementById('music-btn').addEventListener('click', function() {
    var audio = document.getElementById('bg-music');
    if (audio.paused) {
      audio.play();
      this.innerText = "🎵 Müzik Çalıyor";
      this.style.background = "#ff2a2a";
      this.style.color = "white";
    } else {
      audio.pause();
      this.innerText = "🎵 Müziği Başlat";
      this.style.background = "transparent";
      this.style.color = "#ff2a2a";
    }
  });
</script>
</body>
</html>
