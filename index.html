<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALBUKE & FURKAN</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        /* Arka Plan Efektleri */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 20, 147, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        /* Giriş (Key) Ekranı */
        #auth-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: opacity 1s ease;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 20, 147, 0.3);
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.2);
            width: 400px;
            max-width: 90%;
        }

        .auth-box h2 {
            font-family: 'Cinzel', serif;
            margin-bottom: 20px;
            color: #ff1493;
            text-shadow: 0 0 10px #ff1493;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #ff1493;
            color: #fff;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(45deg, #ff1493, #8a2be2);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
            transition: 0.3s;
            width: 100%;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.8);
        }

        /* Ana İçerik Alanı */
        #main-content {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        #heartCanvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* Arayüz / Yazılar */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .title {
            margin-top: 50px;
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            background: linear-gradient(to right, #ffb6c1, #ff1493, #ffb6c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
            letter-spacing: 5px;
            animation: pulseTitle 3s infinite alternate;
        }

        .center-name {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            color: #fff;
            text-shadow: 0 0 20px #ff1493, 0 0 40px #ff1493, 0 0 60px #8a2be2;
            animation: heartbeat 1.5s infinite;
        }

        .quote {
            position: absolute;
            top: 60%;
            font-size: 1.5rem;
            font-style: italic;
            color: #f8d7da;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 20, 147, 0.3);
            backdrop-filter: blur(5px);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* YouTube Oynatıcıyı Tamamen Gizleyen Alan */
        #youtube-player-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        /* Animasyonlar */
        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 20px #ff1493, 0 0 40px #ff1493; }
            15% { transform: translate(-50%, -50%) scale(1.15); text-shadow: 0 0 30px #ff1493, 0 0 60px #ff1493, 0 0 80px #fff; }
            30% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 20px #ff1493, 0 0 40px #ff1493; }
            45% { transform: translate(-50%, -50%) scale(1.15); text-shadow: 0 0 30px #ff1493, 0 0 60px #ff1493, 0 0 80px #fff; }
            60% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 20px #ff1493, 0 0 40px #ff1493; }
            100% { transform: translate(-50%, -50%) scale(1); text-shadow: 0 0 20px #ff1493, 0 0 40px #ff1493; }
        }

        @keyframes pulseTitle {
            from { text-shadow: 0 0 10px rgba(255, 20, 147, 0.5); }
            to { text-shadow: 0 0 30px rgba(255, 20, 147, 1), 0 0 40px rgba(138, 43, 226, 0.8); }
        }

        #error-msg {
            color: #ff4d4d;
            margin-top: 15px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- Giriş Ekranı -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>GİRİŞ</h2>
            <div class="input-group">
                <input type="password" id="key-input" placeholder="Anahtarı Giriniz..." autocomplete="off">
            </div>
            <button class="btn" onclick="checkKey()">Giriş Yap</button>
            <p id="error-msg">Hatalı Key! Lütfen tekrar dene.</p>
        </div>
    </div>

    <!-- Ana Site -->
    <div id="main-content">
        <canvas id="heartCanvas"></canvas>
        <div class="ui-layer">
            <h1 class="title">HALBUKE & FURKAN</h1>
            <h2 class="center-name">HALBUKE</h2>
            <p class="quote">"Sen benim gökyüzüne gönderdiğim duamın yeryüzündeki en güzel cevabısın..."</p>
        </div>
    </div>

    <!-- GİZLİ YOUTUBE OYNATICI -->
    <div id="youtube-player-container">
        <div id="ytplayer"></div>
    </div>

    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const youtubeVideoID = "abps1Fk5-gc"; // Eklediğin Shorts videosunun ID'si
        let player;
        let isPlayerReady = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytplayer', {
                height: '10',
                width: '10',
                videoId: youtubeVideoID,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': youtubeVideoID, // Şarkı bitince tekrar başa sarsın diye
                    'playsinline': 1
                },
                events: {
                    'onReady': function() { isPlayerReady = true; }
                }
            });
        }

        const correctKey = "heraXfurkan";

        function checkKey() {
            const input = document.getElementById("key-input").value;
            if(input === correctKey) {
                if(isPlayerReady) {
                    player.playVideo();
                }

                document.getElementById("auth-screen").style.opacity = "0";
                setTimeout(() => {
                    document.getElementById("auth-screen").style.display = "none";
                    document.getElementById("main-content").style.display = "block";
                    initCanvas();
                }, 1000);
            } else {
                const err = document.getElementById("error-msg");
                err.style.display = "block";
                setTimeout(() => err.style.display = "none", 3000);
            }
        }

        function initCanvas() {
            const canvas = document.getElementById('heartCanvas');
            const ctx = canvas.getContext('2d');
            
            let width, height;
            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const particles = [];
            const particleCount = 200; 

            class TextParticle {
                constructor() {
                    this.t = Math.random() * Math.PI * 2; 
                    this.speed = (Math.random() * 0.01) + 0.002;
                    this.size = Math.random() * 15 + 8; 
                    this.opacity = Math.random() * 0.5 + 0.2;
                    this.color = `hsla(${Math.random() * 40 + 320}, 100%, 65%, ${this.opacity})`;
                    this.scaleMultiplier = (window.innerWidth > 768) ? 22 : 12; 
                }

                update() {
                    this.t += this.speed;
                    if (this.t > Math.PI * 2) this.t = 0;
                }

                draw() {
                    let x = 16 * Math.pow(Math.sin(this.t), 3);
                    let y = -(13 * Math.cos(this.t) - 5 * Math.cos(2*this.t) - 2 * Math.cos(3*this.t) - Math.cos(4*this.t));
                    
                    let drawX = (width / 2) + (x * this.scaleMultiplier);
                    let drawY = (height / 2) + (y * this.scaleMultiplier) - 50; 

                    ctx.font = `${this.size}px 'Poppins', sans-serif`;
                    ctx.fillStyle = this.color;
                    ctx.textAlign = "center";
                    ctx.fillText("HALBUKE", drawX, drawY);
                }
            }

            for (let i = 0; i < particleCount; i++) {
                particles.push(new TextParticle());
            }

            function animate() {
                ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
                ctx.fillRect(0, 0, width, height);

                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                requestAnimationFrame(animate);
            }
            
            animate();
        }
    </script>
</body>
</html>
